# Integración continua: en cada push o pull request, GitHub revisa que el proyecto
# compile y que las pruebas pasen. El resultado aparece en la pestaña "Actions".
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Las pruebas no usan la base de datos, pero Prisma necesita una URL para generar el cliente
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build